name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            DeviceMocker/DeviceMocker.csproj
            Samples/PosHardwareTestApp/PosHardwareTestApp.csproj
            Tests/DeviceMocker.Tests/DeviceMocker.Tests.csproj
      - name: Restore tests
        run: dotnet restore Tests/DeviceMocker.Tests/DeviceMocker.Tests.csproj
      - name: Test
        run: dotnet test Tests/DeviceMocker.Tests/DeviceMocker.Tests.csproj -c Release --no-restore --verbosity normal
      - name: Build release
        run: dotnet build DeviceMocker/DeviceMocker.csproj -c Release --no-restore -warnaserror
